    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get:
  cupertino_icons:
  table_calendar:
  hive:
  hive_flutter:
  uuid:
  flutter_svg:
  intl:
  extended_sliver:
  url_launcher:
  http: ^1.2.0
  webview_flutter: ^4.10.0
  quiver: ^3.2.1
  flutter_local_notifications: ^17.2.4
  flutter_secure_storage: ^9.2.4
  path_provider:
  share_plus: ^12.0.1
  timezone:
  device_info_plus:
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
