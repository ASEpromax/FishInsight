name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze || true

      - name: Build Release APK (ARM64)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/FishInsight-v1.0.0-arm64.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FishInsight-v1.0.0-arm64
          path: build/app/outputs/flutter-apk/FishInsight-v1.0.0-arm64.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: FishInsight v1.0.0
          files: build/app/outputs/flutter-apk/FishInsight-v1.0.0-arm64.apk
          body: |
            ## FishInsight (知鱼) v1.0.0

            ### 快速下载 / Download:
            - **[FishInsight-v1.0.0-arm64.apk](https://github.com/ASEpromax/FishInsight/releases/download/v1.0.0/FishInsight-v1.0.0-arm64.apk)** (20.6MB)

            ---
            ### 功能亮点:
            1. 官方 WebView 安全登录与一键订单同步导入
            2. 多维财务经营大盘（毛利、净利、ROI、成本透视、收支柱状图）
            3. 订单履约工作台（待发货、已发货、已完成、售后纠纷全流程管线）
            4. 实时单笔净利润与闲鱼 0.6% 软件服务费测算器
            5. DeepSeek AI 商业参谋智能诊断

            *(所有数据均保存在本地 Hive 数据库中，100% 保护卖家隐私)*
