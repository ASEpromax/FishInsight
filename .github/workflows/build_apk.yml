name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze || true

      - name: Build Release APK (ARM64)
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/FishInsight-v1.1.0-arm64.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FishInsight-v1.1.0-arm64
          path: build/app/outputs/flutter-apk/FishInsight-v1.1.0-arm64.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: FishInsight v1.1.0
          files: build/app/outputs/flutter-apk/FishInsight-v1.1.0-arm64.apk
          body: |
            ## 知鱼 (FishInsight) v1.1.0 — 闲鱼账号安全登录

            ### 🔧 本次更新

            #### 修复
            - **修复闲鱼同步加载失败** (`net::ERR_NAME_NOT_RESOLVED`)：旧版加载了不存在的 `m.goofish.com/my/sold` 页面，现已改为正确的淘宝官方登录入口

            #### 新增
            - **闲鱼账号安全登录**：通过淘宝官方 WebView 页面登录，知鱼不保存任何账号密码
            - **登录与同步分离**：登录页只负责认证，同步页独立提取订单，流程更清晰
            - **账号管理中心**：设置页展示登录状态、昵称、上次同步时间，支持一键退出
            - **Cookie 过期检测**：同步时自动检测登录是否过期，引导重新登录
            - **安全存储**：登录凭证使用 Android Keystore 硬件加密（flutter_secure_storage）

            #### 改进
            - 所有页面的同步按钮智能路由（已登录→同步页，未登录→登录页）
            - 订单提取脚本增加多策略数据源检测
            - 退出登录增加二次确认，已导入订单不受影响

            ### 🔒 安全说明
            - 登录全程由淘宝官方页面完成，知鱼**不获取、不存储**你的账号密码
            - Cookie 由 Android WebView 内核管理，加密存储于 App 沙盒
            - 所有交易数据 100% 本地存储，不上传任何服务器

            ### 📲 下载
            - **[FishInsight-v1.1.0-arm64.apk](https://github.com/ASEpromax/FishInsight/releases/download/v1.1.0/FishInsight-v1.1.0-arm64.apk)**
