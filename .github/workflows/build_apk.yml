name: 打包 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 获取项目依赖
        run: flutter pub get

      - name: 语法与类型检测
        run: |
          flutter analyze > analyze.log 2>&1 || true
          cat analyze.log
          echo "### Flutter Analyze 输出" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat analyze.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 构建 Release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: 上传 APK 安装包到构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FishInsight-arm64-release
          path: build/app/outputs/flutter-apk/*.apk

      - name: 自动同步发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 知鱼 (FishInsight) v1.0.0 正式发布版
          files: build/app/outputs/flutter-apk/*.apk
          body: |
            ### 知鱼 (FishInsight) —— 闲鱼商业智能与财务分析系统
            - **订单履约工作台**：待沟通、待发货倒计时、待买家确认收货流转追踪
            - **全要素财务精算**：进货成本、运费、包装耗材、闲鱼平台服务费扣点、实时单笔净毛利
            - **多维商业数据看板**：收支走势柱状图、品类吸金力与 ROI 排行榜、成本构成透视
            - **AI 商业参谋**：DeepSeek 智能驱动的闲鱼经营诊断与选品定价建议
            
            点击下方 Assets 展开列表中的 `.apk` 即可直接下载安装体验。
